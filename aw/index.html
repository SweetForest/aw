<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  let rank = params.get("r");

  if (!rank) {
    window.location.replace("error");
    return;
  }

  rank = rank.replace(/[^A-Za-z0-9\-_]/g, "");

  if (rank.length === 0) {
    window.location.replace("error");
    return;
  }

  fetch("https://aw-hook.sweetforestttt.workers.dev/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      rank: rank
    })
  })
  .then((response) => {
    if (response.ok) {
      window.location.replace("success");
    } else {
      window.location.replace("error");
    }
  })
  .catch(() => {
    window.location.replace("error");
  });
})();
</script>
