<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Error</title>
<style>
body{
  background:#0a0a0f;
  color:#e8e8f4;
  font-family:sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}
.box{
  background:#16161f;
  padding:40px;
  border-radius:16px;
  border:1px solid #22222e;
  max-width:420px;
}
</style>
</head>
<body>

<div class="box">
  <h2>❌ Submission Failed</h2>

  <p>We were unable to process your request.</p>

  <p style="opacity:.85">
    Please try to regenerate link again.
  </p>

  <p style="opacity:.6;font-size:14px">
    Your request may have already been received, or the server may be temporarily unavailable.
    Please wait before trying again.
  </p>
</div>

</body>
</html>
